<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/style.css" />
    <script src="./assets/script.js" defer></script>
    <title>DISNEY</title>
  </head>
  <body>
    <header>
      <div><img src="assets/imagens/logo.png" alt=""></div>
      <nav>
        <input type="search" name="nome" id="buscar" placeholder="Digite a sua busca"/>

        <button id="btnEnviar">ENVIAR</button>
      </nav>
    </header>

    <div class="container">
      <main>
        <div class="border"><h2>Explore os personagens Disney</h2></div>
        <p id="mensagemErro"></p>
      </main>

      <section> <!--alterar aqui, email professor-->
        <div>
          <img
            src="assets/imagens/disney_and_pixar_characters_wallpaper_by_gikesmanners1995_dkr4zg1-fullview.jpg"
            alt=""
            id="imagem"
          />
        </div>
        <article>
          <div class="border"><h3 id="nome">Nome:</h3></div>
          <div class="border"><h3 id="id">ID:</h3></div>
          <div class="border"><h3 id="filmes">Filmes:</h3></div>
          <div class="border"><h3 id="series">Séries:</h3></div>

          <div class="buttonEnd">
            <button id="btnVoltar">VOLTAR</button>
            <button id="btnAvancar">AVANÇAR</button>
          </div>
        </article>
      </section>
    </div>
  </body>
</html>
